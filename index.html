.act{border-radius:50%;color:#0a0c06;border:0}

#kG{background:#3f82ff;box-shadow:0 5px 0 #1f3c8c;color:#fff}
#kX{background:#353b2b;box-shadow:0 5px 0 #1c2114;color:#b8bfac}
