.tg{display:flex;gap:6px;flex-wrap:wrap}

.screen canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.4) 100%)}

.padr{grid-area:padr;display:grid;grid-template-columns:repeat(2,66px);grid-template-rows:66px 66px;gap:10px}
.k{touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font:8px var(--px);position:relative;transition:transform .05s}
.k svg{width:24px;height:24px}

.dir{background:#141a0b;color:var(--lime);border:2px solid #2f4013;border-radius:12px;box-shadow:0 4px 0 #0b0f05}
#kU{grid-column:2;grid-row:1}#kL{grid-column:1;grid-row:2}#kD{grid-column:2;grid-row:2}#kR{grid-column:3;grid-row:2}
.act{border-radius:50%;color:#0a0c06;border:0}
.act svg{width:30px;height:30px}
#kJ{background:var(--lime);box-shadow:0 5px 0 #5f8a0c;grid-column:1;grid-row:2}
#kK{background:#ffb020;box-shadow:0 5px 0 #a8650f;grid-column:2;grid-row:2}
#kB{background:#e2566f;box-shadow:0 5px 0 #8f2236;grid-column:1;grid-row:1}
